markdown: >-
  # Attio


  ## Overview

  Attio is an AI-native CRM built for startups. It offers a modern, flexible CRM
  platform with AI capabilities integrated throughout the product.


  ## Key Features

  - **AI-native CRM**: built with AI capabilities at its core

  - **Free plan**: available for getting started

  - **Modern interface**: designed for startup teams

  - **Flexible data model**: adapts to your processes


  ## Pricing

  Free plan available; from $36/user/month.


  ## Deployment

  Cloud (SaaS).


  ## Integrations

  - API available

  - Zapier integration
