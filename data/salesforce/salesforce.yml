name: Salesforce
description: Salesforce is a proprietary cloud-based customer relationship
  management platform founded by Marc Benioff, first released in 1999. It is
  implemented in APEX (proprietary Java-like language), uses a proprietary
  database, and offers cloud computing deployment.
