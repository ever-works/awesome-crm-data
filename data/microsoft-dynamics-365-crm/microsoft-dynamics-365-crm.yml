markdown: >-
  ## Overview


  Microsoft Dynamics CRM, now part of Microsoft Dynamics 365, is an enterprise
  customer relationship management platform first released in 2003. It provides
  sales, customer service, field service, and marketing automation capabilities
  for organizations of various sizes.


  ## Features


  - Sales force automation

  - Customer service and case management

  - Marketing automation

  - Field service management

  - Project service automation

  - Web-based interface

  - Multi-language support (over 40 languages)

  - Office integration

  - Email attachment to business objects

  - Global search

  - Time tracking

  - LDAP support with ADFS


  ## Pricing


  Proprietary or SaaS licensing model. Pricing varies by module and user count.


  ## Deployment


  Cloud-based (SaaS) or on-premise deployment on Windows.


  ## Integrations


  - Microsoft Office

  - Outlook

  - SharePoint

  - Azure Active Directory / LDAP

  - Power Platform

  - Microsoft Teams


  ## Repository


  Proprietary software; no public repository.
