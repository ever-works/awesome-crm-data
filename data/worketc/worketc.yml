name: WORKetc
description: WORKetc is a SaaS-based all-in-one business management platform by
  Daniel Barnett, first released in 2009. It is implemented in C# and .NET, uses
  Microsoft SQL Server database, and runs on Windows.
source_url: https://www.worketc.com
