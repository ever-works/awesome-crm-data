markdown: >-
  ## Overview


  WORKetc is an all-in-one business management platform first released in 2009.
  It combines CRM, project management, billing, help desk, and time tracking
  functionality in a single system.


  ## Features


  - Customer relationship management

  - Project management

  - Billing and invoicing

  - Help desk and support

  - Time tracking

  - Web-based interface

  - Multi-language support (de, en, es, fr, it, nl)

  - Office integration (Outlook Addon and Google Docs)

  - Email attachment to business objects

  - Global search

  - LDAP support


  ## Pricing


  SaaS subscription model with tiered pricing based on features and users.


  ## Deployment


  Cloud-based (SaaS) deployment.


  ## Integrations


  - Microsoft Outlook Addon

  - Google Docs

  - Email systems

  - LDAP directory services


  ## Repository


  Proprietary software; no public repository.
