markdown: >-
  ## Overview


  Clay is a personal CRM designed for individuals to manage their professional
  and personal relationships, automatically enriching contact data and surfacing
  updates about contacts.


  ## Key Features


  - **Contact Management**: Organize and track personal and professional
  contacts

  - **Automatic Updates**: Proactively notified about contacts' activities and
  changes

  - **Data Enrichment**: Automatic contact information enrichment

  - **Network Mapping**: Visualize relationships and connections

  - **Reminders**: Follow-up and interaction reminders


  ## Pricing


  - **Free Plan**: 1,000 contacts

  - **Paid Plans**: Additional contacts and features


  ## Deployment


  Cloud-based (SaaS) with web and mobile applications.
