markdown: >-
  ## Overview


  HubSpot CRM Free is a customer relationship management platform first released
  in 2014. It provides core CRM functionality including contact management, deal
  tracking, email integration, and task management at no cost, with paid
  upgrades for advanced features.


  ## Features


  - Contact and company management

  - Deal and task tracking

  - Email integration (Gmail, G Suite, Outlook, Office 365)

  - Web-based interface

  - Multi-language support (en, fr, jp, de, pt, es)

  - Email attachment to business objects

  - Global search

  - Office integration


  ## Pricing


  Free plan available; freemium model with paid Marketing, Sales, Service, and
  CMS Hubs for advanced features.


  ## Deployment


  Cloud-based (SaaS) deployment.


  ## Integrations


  - Gmail and G Suite

  - Outlook and Office 365

  - HubSpot Marketing, Sales, and Service Hubs

  - Various third-party integrations via App Marketplace


  ## Repository


  Proprietary software; no public repository.
