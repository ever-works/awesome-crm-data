markdown: >-
  ## Overview


  SAP CRM is an enterprise customer relationship management platform by SAP SE,
  first released in 2000. It provides sales, marketing, service, and customer
  interaction management capabilities for large organizations.


  ## Features


  - Sales force automation

  - Marketing management

  - Customer service and support

  - Interaction center

  - Web channel management

  - Analytics and reporting

  - Multi-language support

  - Web-based interface

  - Office integration

  - Email attachment to business objects

  - Global search

  - Time tracking

  - LDAP support


  ## Pricing


  Proprietary licensing model. Enterprise pricing available from SAP sales.


  ## Deployment


  On-premise deployment on Windows, Linux, and Unix.


  ## Integrations


  - SAP HANA

  - SAP ERP

  - SAP Business Suite

  - LDAP directory services


  ## Repository


  Proprietary software; no public repository.
