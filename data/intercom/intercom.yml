markdown: >
  # Intercom


  ## Overview

  Intercom is a customer relationship management and messaging tool for web
  businesses. It helps businesses build relationships with users to create loyal
  customers by unifying customer communication in one platform.


  ## Key Features

  - User-friendly interface

  - Comprehensive customer communication tools

  - Customization and integration options

  - Automation capabilities for messaging and support


  ## Pricing

  Paid.


  ## Deployment

  Cloud (SaaS).


  ## Integrations

  - Third-party integrations

  - API available
