markdown: >
  # Insightly


  ## Overview

  Insightly is an easy, powerful, and affordable online Customer Relationship
  and Project Management software used by over 400,000 small businesses
  worldwide. It combines CRM capabilities with project management features in
  one platform.


  ## Key Features

  - User-friendly interface

  - Integration capabilities with other business applications

  - Customizable to fit business processes

  - Project management features alongside CRM

  - Affordable pricing for small businesses


  ## Pricing

  Paid with tiered plans.


  ## Deployment

  Cloud (SaaS).


  ## Integrations

  - Third-party business application integrations

  - API available
