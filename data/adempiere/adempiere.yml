name: Adempiere
description: Adempiere is an open-source ERP and CRM system originally created
  by Jorg Janke. It is released under GPLv2 license, implemented in Java, and
  runs on Windows, Linux, Unix, and Mac. The last stable version 3.9.3 was
  released in December 2019.
