markdown: >-
  ## Overview


  Adempiere is an open-source enterprise resource planning (ERP) and customer
  relationship management (CRM) software platform. It was first released in 2006
  and is developed by a community of contributors led by Jorg Janke.


  ## Features


  - ERP and CRM functionality

  - Multi-language and multi-currency support

  - Accounting and financial management

  - Supply chain management

  - Customer relationship management

  - Project management

  - Warehouse management

  - Cross-platform (Windows, Linux, Unix, Mac)


  ## Pricing


  Free and open-source under the GPLv2 license.


  ## Deployment


  Self-hosted; runs on Windows, Linux, Unix, and Mac.


  ## Integrations


  - Java-based architecture

  - Database backend not specified in source


  ## Repository


  Source code available via the Adempiere project website under GPLv2 license.
