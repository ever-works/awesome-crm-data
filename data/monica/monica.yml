markdown: >-
  ## Overview


  Monica is an open-source personal relationship manager (PRM) for keeping track
  of friends, family, and business contacts. It helps users manage
  relationships, set reminders, and organize contact information.


  ## Features


  - Contact management for friends, family, and business contacts

  - Relationship tracking

  - Reminders and follow-ups

  - Self-hostable

  - Open-source licensed under AGPL-3.0


  ## Pricing


  Free and open-source under the AGPL-3.0 license.


  ## Deployment


  Self-hosted via GitHub repository: https://github.com/monicahq/monica


  ## Repository


  https://github.com/monicahq/monica


