markdown: >-
  ## Overview


  Group-Office is an open-source groupware and CRM platform first released in
  2003. It provides email, calendar, contacts, file management, and CRM
  functionality for teams and organizations.


  ## Features


  - Customer relationship management

  - Email and groupware

  - Calendar and scheduling

  - Contacts and address book

  - File management and document sharing

  - Project management

  - Multi-language support (over 20 languages)

  - Web-based interface

  - Office integration

  - Time tracking


  ## Pricing


  AGPLv3 open-source edition available free; SaaS and proprietary editions
  available commercially.


  ## Deployment


  Self-hosted (cross-platform) or SaaS/cloud deployment.


  ## Integrations


  - Email systems

  - Calendar systems

  - LDAP directory services


  ## Repository


  Source code available under AGPLv3 license from Group-Office project.
