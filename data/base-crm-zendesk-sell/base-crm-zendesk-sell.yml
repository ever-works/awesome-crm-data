markdown: >-
  ## Overview


  Base CRM, acquired by Zendesk and now marketed as Zendesk Sell, is a sales CRM
  platform launched in 2009. It helps sales teams manage leads, contacts, and
  deals through a web-based interface and mobile applications.


  ## Features


  - Lead and contact management

  - Sales pipeline and deal tracking

  - Email integration

  - Mobile apps for iOS, Android, and Windows Phone

  - Multi-language support (de, en, es, fr, nl, pl, pt)

  - Web-based interface

  - Office integration

  - Desktop environment support

  - Global search

  - LDAP support


  ## Pricing


  SaaS subscription model. Pricing varies by plan and number of users.


  ## Deployment


  Cloud-based (SaaS) deployment.


  ## Integrations


  - Office integration

  - Email clients

  - LDAP directory services


  ## Repository


  Proprietary software; no public repository.
