name: Base CRM (Zendesk Sell)
description: Base CRM, now known as Zendesk Sell, is a SaaS-based CRM platform
  first released in 2009. It is implemented in Ruby on Rails and Python, uses
  MySQL database, and offers mobile apps for iOS, Android, and Windows Phone.
