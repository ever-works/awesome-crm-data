markdown: >-
  ## Overview


  Clarify is an AI-native CRM designed to automate sales administrative work by
  connecting to email and calendar, handling meeting briefs, transcription,
  summaries, and CRM updates automatically.


  ## Key Features


  - **AI Agent**: Automatically logs calls, emails, and next steps

  - **Meeting Assistant**: Pre-call briefs, meeting transcription, post-meeting
  summaries

  - **CRM Updates**: Automatically updates CRM with discussion points and next
  actions

  - **Email & Calendar Sync**: Connects to email and calendar for data
  synchronization

  - **Contact & Company Tracking**: Track people, companies, and deals

  - **Basic Reporting**: Simple reporting and dashboards

  - **Workflow Automation**: Flexible automation tools

  - **Nudges**: Alerts when items need attention

  - **Unlimited Seats**: No per-user pricing


  ## Pricing


  - **Free Plan**: Unlimited seats, capped at around 2,500 AI credits per month

  - **Paid Plans**: Additional AI credits and features


  ## Deployment


  Cloud-based (SaaS) with web and Mac applications.
