markdown: >-
  ## Overview


  Contrack is an open-source contact manager designed for personal relationship
  management. It helps users import, deduplicate, and enrich contacts while
  providing follow-up reminders and private address books for each family or
  team member.


  ## Features


  - Contact import and deduplication

  - Contact enrichment

  - Follow-up reminders

  - Private address books for family or team members

  - Self-hostable


  ## Pricing


  Free and open-source under the MIT license.


  ## Deployment


  Self-hosted via GitHub repository: https://github.com/arvarik/contrack


  ## Repository


  https://github.com/arvarik/contrack
