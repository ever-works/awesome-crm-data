markdown: >-
  ## Overview


  Booksy is a business management and appointment scheduling platform designed
  for service-based businesses such as salons, spas, and wellness providers. It
  was first released in 2014 and helps businesses manage appointments, clients,
  and operations.


  ## Features


  - Appointment scheduling and booking

  - Client management

  - Calendar and calendar sync

  - Automated text and email marketing

  - Staff schedule management

  - Mobile apps for iOS and Android

  - Multi-language support (en, pl, es, pt, fr, de, uk, vi, zh)

  - Web-based interface

  - Time tracking

  - Email attachment to business objects


  ## Pricing


  SaaS subscription model. Pricing varies by plan and features.


  ## Deployment


  Cloud-based (SaaS) deployment.


  ## Integrations


  - Reserve with Google

  - Email and SMS marketing

  - Calendar synchronization


  ## Repository


  Proprietary software; no public repository.
