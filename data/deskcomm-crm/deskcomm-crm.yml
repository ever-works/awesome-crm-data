  ## Overview


  Deskcomm CRM is an open-source sales CRM designed for WhatsApp. It uses AI
  agents to answer and qualify leads automatically.


  ## Features


  - WhatsApp integration

  - AI agents for lead qualification

  - Automated responses

  - Lead management

  - Self-hostable


  ## Pricing


  Free and open-source.


  ## Deployment


  Self-hosted via GitHub repository: https://github.com/melgarafael/DeskcommCRM


