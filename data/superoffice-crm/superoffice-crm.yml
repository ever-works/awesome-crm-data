markdown: >-
  ## Overview


  SuperOffice CRM is a customer relationship management platform first released
  in 1990. It provides sales, marketing, and customer service functionality for
  businesses in Europe and globally.


  ## Features


  - Contact and company management

  - Sales pipeline and opportunity management

  - Marketing campaigns

  - Customer service and support

  - Web-based interface

  - Multi-language support (cn, de, dk, en, es, fi, fr, it, jp, nl, no, ru, se,
  zh)

  - Office integration

  - Email attachment to business objects

  - Global search

  - Time tracking


  ## Pricing


  Proprietary licensing model. Pricing available from SuperOffice sales.


  ## Deployment


  On-premise deployment on Windows or cloud/SaaS options.


  ## Integrations


  - Microsoft Office

  - Email systems

  - LDAP directory services


  ## Repository


  Proprietary software; no public repository.
