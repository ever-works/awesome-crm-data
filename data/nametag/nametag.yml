markdown: >-
  ## Overview


  Nametag is an open-source personal relationship manager that tracks birthdays,
  contact details, and maps connections between people. It helps users visualize
  and manage their personal network.


  ## Features


  - Birthday tracking

  - Contact detail management

  - Relationship mapping

  - Self-hostable


  ## Pricing


  Free and open-source.


  ## Deployment


  Self-hosted via GitHub repository: https://github.com/mattogodoy/nametag


  ## Repository


  https://github.com/mattogodoy/nametag
