markdown: >-
  ## Overview


  Act! CRM is a customer relationship management software originally created by
  Pat Sullivan and Mike Muhney in 1987. It is designed for small and
  medium-sized businesses to manage contacts, activities, and sales pipelines.


  ## Features


  - Contact and activity management

  - Sales pipeline tracking

  - Email integration

  - Mobile access (iOS, Android)

  - Web-based and desktop deployment options

  - MS SQL database backend

  - Multi-language support (en, de, fr)

  - LDAP support

  - Web-based access

  - Global search

  - Time tracking

  - Email attachment to business objects


  ## Pricing


  Proprietary or SaaS licensing model. Contact vendor for pricing details.


  ## Deployment


  Available as on-premise (Windows) or SaaS/cloud deployment.


  ## Integrations


  - Microsoft Office integration

  - Email clients

  - LDAP directory services


  ## Repository


  Proprietary software; no public repository.
