name: Act! CRM
description: Act! CRM is a customer relationship management software developed
  by Pat Sullivan and Mike Muhney, first released in 1987. It is available as
  proprietary or SaaS deployment and runs on Windows, Web, iOS, and Android with
  MS SQL as its database backend. The last stable version 22.1 was released in
  June 2020.
source_url: https://www.act.com
category: Sales CRM
