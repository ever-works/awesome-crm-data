name: Neolane (Adobe Campaign)
description: Neolane is a proprietary marketing automation and campaign
  management platform by Adobe, first released in 2001. It is implemented in C++
  and JavaScript, uses MS SQL, Oracle, PostgreSQL, and MySQL databases, and runs
  on Windows and Linux.
