name: SugarCRM
description: SugarCRM is a customer relationship management platform co-founded
  by John Roberts, Clint Oram, and Jacob Taylor, first released in 2004. It is
  available as proprietary or SaaS, implemented in PHP, and supports MySQL,
  Microsoft SQL Server, IBM DB2, and Oracle databases.
source_url: https://www.sugarcrm.com
