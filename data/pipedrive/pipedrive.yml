markdown: >-
  ## Overview


  Pipedrive is a sales CRM platform designed for sales teams, first released in
  2011. It provides a visual sales pipeline interface to help teams manage
  leads, deals, and activities.


  ## Features


  - Visual sales pipeline management

  - Lead and contact management

  - Deal tracking

  - Activity and task management

  - Email integration

  - Web-based interface

  - Mobile apps for iOS and Android

  - Multi-language support (de, en, es, et, fi, fr, it, no, nl, pl, pt, ru, tr,
  ko, ja)

  - Office integration

  - Email attachment to business objects

  - Global search

  - Time tracking

  - Desktop environment support


  ## Pricing


  SaaS subscription model with tiered pricing based on features and users.


  ## Deployment


  Cloud-based (SaaS) deployment.


  ## Integrations


  - Office integration

  - Email clients

  - Various third-party integrations


  ## Repository


  Proprietary software; no public repository.
