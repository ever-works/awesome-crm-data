markdown: >-
  ## Overview


  ChurchCRM is an open-source church management CRM for managing people,
  families, groups, events, attendance, and giving.


  ## Features


  - People management

  - Family management

  - Group management

  - Event management

  - Attendance tracking

  - Giving/donation tracking

  - Self-hostable


  ## Pricing


  Free and open-source.


  ## Deployment


  Self-hosted via GitHub repository: https://github.com/ChurchCRM/CRM


  ## Repository


  https://github.com/ChurchCRM/CRM
