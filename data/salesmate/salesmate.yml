markdown: >-
  # Salesmate


  ## Overview

  Salesmate is a CRM platform focused on customization. It features a
  drag-and-drop interface and customizable modules that allow teams to adapt the
  CRM to their specific processes.


  ## Key Features

  - **Drag-and-drop interface**: easy customization of the CRM layout

  - **Customizable modules**: adapt the CRM to your business processes

  - **Flexible structure**: CRM adapts to you, not the other way around


  ## Pricing

  From $29/user/month.


  ## Deployment

  Cloud (SaaS).


  ## Integrations

  - API available

  - Zapier integration
