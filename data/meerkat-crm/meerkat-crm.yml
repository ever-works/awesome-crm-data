markdown: >-
  ## Overview


  Meerkat CRM is an open-source digital rolodex for personal relationship
  management. It features contact circles, relationship tracking, employment
  history, and birthday reminders.


  ## Features


  - Contact circles

  - Relationship tracking

  - Employment history

  - Birthday reminders

  - Self-hostable


  ## Pricing


  Free and open-source.


  ## Deployment


  Self-hosted via GitHub repository: https://github.com/meerkatcrm/meerkat-crm


  ## Repository


  https://github.com/meerkatcrm/meerkat-crm
