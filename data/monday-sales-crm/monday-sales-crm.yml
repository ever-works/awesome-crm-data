markdown: >-
  ## Overview


  monday sales CRM is a customizable sales CRM platform designed for lead and
  pipeline management, contact tracking, and team collaboration.


  ## Key Features


  - Lead Management

  - Contact Management

  - Pipeline Management

  - Email Integration

  - Customizable workflows

  - Sales dashboards


  ## Pricing


  Starts from $12 per seat per month. Free trial available.


  ## Deployment


  Cloud-based deployment.


  ## Integrations


  Native integrations with email, calendar, and productivity tools. API-based
  integrations available.
