markdown: >-
  ## Overview


  Capsule CRM is a customer relationship management platform designed for small
  businesses, first released in 2009. It helps teams organize contacts, track
  sales pipelines, and manage tasks through a simple web interface and mobile
  apps.


  ## Features


  - Contact and relationship management

  - Sales pipeline and task tracking

  - Email integration

  - Gmail and G Suite integration

  - Web-based interface

  - Mobile apps for iOS and Android

  - Global search

  - Email attachment to business objects

  - Single language support (en)


  ## Pricing


  SaaS subscription model with various plan tiers based on features and users.


  ## Deployment


  Cloud-based (SaaS) deployment.


  ## Integrations


  - Gmail and G Suite

  - Email clients


  ## Repository


  Proprietary software; no public repository.
