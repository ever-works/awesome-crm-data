name: Capsule CRM
description: Capsule CRM is a SaaS-based customer relationship management
  platform by Zestia Ltd., first released in 2009. It is implemented in Java,
  Scala, and JavaScript, uses MySQL database, and offers web and mobile access
  for iOS and Android.
source_url: https://capsulecrm.com
category: Sales CRM
