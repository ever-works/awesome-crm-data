markdown: >-
  ## Overview


  Creatio is a no-code platform for customer relationship management and
  business process automation. It supports sales, marketing, and service
  management workflows.


  ## Key Features


  - Lead Management

  - Sales Forecasting

  - Opportunity Management

  - Contact Management

  - No-code process automation

  - Pipeline management

  - Email integration


  ## Pricing


  Starts from $40 per user per month. No free plan available. Free trial
  available.


  ## Deployment


  Cloud-based deployment.


  ## Integrations


  Native integrations with email platforms and business applications. API-based
  integrations available.
