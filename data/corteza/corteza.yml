markdown: >-
  ## Overview


  Corteza is an open-source CRM platform that includes a unified workspace,
  enterprise messaging, and a low-code environment for rapidly and securely
  delivering records-based management solutions.


  ## Features


  - Unified workspace for customer relationship management

  - Enterprise messaging capabilities

  - Low-code environment for rapid application development

  - Records-based management

  - Self-hosted deployment


  ## Technical Details


  - Language: Go

  - License: Apache-2.0

  - Repository: https://github.com/cortezaproject/corteza


  ## Pricing


  Free and open-source under the Apache-2.0 license. Self-hosted deployment.
