markdown: >-
  ## Overview


  EngageBay is an all-in-one CRM platform designed for small businesses,
  combining sales, marketing, service, and live chat capabilities in a unified
  system.


  ## Key Features


  - **Sales CRM**: Contact management, deal tracking, sales pipeline with Kanban
  view

  - **Marketing**: Email marketing, landing pages, forms, email sequences

  - **Service & Help Desk**: Ticketing, live chat, canned responses, AI chatbot

  - **Unified Inbox**: All customer conversations (email, chat, social) in one
  place

  - **Automation**: Workflow automation (paid plans)

  - **Reporting**: Dashboards and reports for sales and marketing performance

  - **Integrations**: Native integrations plus Zapier connectivity for thousands
  of apps

  - **Mobile**: iOS and Android apps available


  ## Pricing


  - **Free Plan**: Up to 250 contacts, 1,000 branded emails per month, includes
  AI chatbot, ticketing, live chat, canned responses

  - **Basic Plan**: $14.99/user/month

  - **Growth Plan**: Higher tier with additional features

  - **Pro Plan**: Enterprise-grade features


  ## Deployment


  Cloud-based (SaaS) with mobile apps for iOS and Android.
