markdown: >-
  ## Overview


  Tryton is an open-source enterprise resource planning (ERP) platform with
  customer relationship management functionality, first released in 2008. It
  provides a modular, high-level platform for business applications.


  ## Features


  - Customer relationship management

  - Accounting and financial management

  - Inventory and stock management

  - Sales and purchase management

  - Project management

  - Multi-language support (bg, ca, cs, de, en, es-ar, es-co, es-es, fr, nl, ru,
  sl)

  - Web-based interface

  - Cross-platform deployment

  - Global search

  - LDAP support

  - Time tracking

  - Email attachment to business objects


  ## Pricing


  Free and open-source under the GPLv3 license.


  ## Deployment


  Self-hosted; cross-platform deployment.


  ## Integrations


  - PostgreSQL, MySQL, SQLite databases

  - Email systems

  - LDAP directory services


  ## Repository


  Source code available at https://hg.savannah.nongnu.org/hgweb/tryton under
  GPLv3 license.
