markdown: >-
  ## Overview


  CiviCRM is an open-source constituent relationship management system designed
  specifically for non-profit and advocacy organizations. First released in
  2004, it integrates with popular content management systems including Drupal,
  WordPress, Joomla, and Backdrop.


  ## Features


  - Constituent and donor management

  - Membership management

  - Event management and registration

  - Email marketing and communications

  - Fundraising and contribution tracking

  - Case management

  - Volunteer management

  - Integration with Drupal, WordPress, Joomla, and Backdrop

  - Web-based interface

  - Multi-language support (over 40 languages)

  - Time tracking via Agiliway's Time Tracker or CiviMobile

  - Email attachment to business objects

  - Global search

  - LDAP support


  ## Pricing


  Free and open-source under the AGPLv3 license. Hosted and support services
  available from partners.


  ## Deployment


  Self-hosted; cross-platform deployment.


  ## Integrations


  - Drupal

  - WordPress

  - Joomla

  - Backdrop CMS

  - Email systems

  - LDAP directory services


  ## Repository


  Source code available at https://github.com/civicrm/civicrm-core under AGPLv3
  license.
