markdown: >-
  # Nutshell


  ## Overview

  Nutshell is a CRM platform focused on sales team management. It offers three
  core management tools: territory-based management, deep reporting with
  forecasts, and customizable notifications to help managers maximize team
  efficiency.


  ## Key Features

  - **Territory-based management**: automatically assign leads based on postal
  code, state, and country selectors

  - **Deep reporting**: stock reports for main pipeline metrics, reporting by
  territory, team member, or source

  - **Forecasts**: see how present performance may influence future results

  - **Customizable notifications**: turn on/off notifications for nearly
  anything; app-only or email delivery

  - **Unlimited contacts**: no contact limits

  - **Social media profile links**: grabs social media profile links of contacts

  - **Drip email campaigns**: naturally raise interest in products and services

  - **Website visitor tracking**: connect to website to follow prospects as they
  browse

  - **AI summarization**: summarizes people, companies, and leads timelines into
  paragraph overviews

  - **Zoom call transcription**: calls transcribed, saved, and summarized

  - **Voice-to-text notetaker**: save time from typing


  ## Pricing

  From $19/user/month for unlimited contacts.


  ## Deployment

  Cloud (SaaS), with mobile apps for iOS and Android.


  ## Integrations

  - Zapier integration
