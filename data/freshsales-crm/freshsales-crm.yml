markdown: >
  # Freshsales CRM


  ## Overview

  Freshsales is a full-fledged CRM designed for high-velocity sales teams. It
  helps sales teams stay organized, focus on the right deals, and is easy enough
  that salespeople adopt it readily, making it well suited to small teams.


  ## Key Features

  - Ease of use and intuitive interface for sales teams

  - Pipeline and deal management

  - Customization options to fit sales processes

  - Integration capabilities with other business tools

  - Sales automation to reduce manual work


  ## Pricing

  Paid with a free trial available.


  ## Deployment

  Cloud (SaaS).


  ## Integrations

  - Freshworks suite

  - Third-party business tool integrations

  - API available
