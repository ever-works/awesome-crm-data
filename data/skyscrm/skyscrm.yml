markdown: >
  # SkyScrm


  ## Overview

  SkyScrm is a chat translation platform that provides high-quality, two-way
  real-time translation services for WhatsApp, Telegram, LINE, Facebook
  Messenger, and other instant messaging apps. It also offers multi-account
  support, allowing teams to manage multiple messaging accounts from one place.


  ## Key Features

  - Two-way real-time translation across WhatsApp, Telegram, LINE, Facebook
  Messenger, and other instant messaging apps

  - Multi-account support for managing several messaging accounts simultaneously

  - CRM-aligned communication for customer conversations across channels


  ## Pricing

  Paid with a free trial. $30/month for the port version (5 ports, starting
  monthly).


  ## Deployment

  Cloud (SaaS).


  ## Integrations

  - WhatsApp

  - Telegram

  - LINE

  - Facebook Messenger
