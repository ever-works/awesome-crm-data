markdown: >-
  ## Overview


  Folk is a CRM platform designed to help teams manage customer relationships
  end-to-end. The platform covers prospecting, lead engagement, phone
  conversations, pipeline management, and deal closing.


  ## Features


  - **Prospect**: Find, enrich, and qualify contacts worth pursuing

  - **Engage**: Interact with leads across channels and keep conversations
  personal at scale

  - **Call**: Record phone conversations with your own number; prep, call,
  record, and review conversations directly in folk

  - **Close**: Surface what to prioritize and next actions for the team to close
  more deals

  - **Shared memory**: Design the ideal data model and feed it with context from
  30+ integrations

  - **AI agents**: Connect folk in your AI stack to let agents do groundwork

  - **AI insights**: Explore data, uncover trends, and find answers with AI


  ## Pricing


  Pricing details are available on the official website.


  ## Deployment


  Cloud-based (SaaS).
