markdown: >-
  ## Overview


  Airtable is a cloud-based platform that combines the simplicity of a
  spreadsheet with the power of a database. It can be configured as a CRM using
  starter templates to track leads, contacts, and deals.


  ## Features


  - Free plan supports up to five people per workspace

  - Each base can hold up to 1,000 records on the free plan

  - Multiple view types: grid, calendar, kanban, gallery, form

  - Custom fields and rich field types (attachments, checkboxes, dropdowns,
  etc.)

  - CRM starter templates available

  - Automation capabilities for workflow triggers

  - Integration with Zapier for connecting to other tools


  ## Pricing


  - Free plan: up to 5 users, 1,000 records per base

  - Paid plans start at $20/user/month (billed annually) for expanded records
  and advanced features


  ## Deployment


  Cloud-hosted SaaS with web and mobile applications.
