markdown: >-
  ## Overview


  OnlyOffice is an open-source office suite that includes CRM functionality,
  first released in 2010. It provides document editing, spreadsheets,
  presentations, and customer relationship management capabilities.


  ## Features


  - Document editing and collaboration

  - Spreadsheets and presentations

  - Customer relationship management

  - Web-based interface

  - Multi-language support (en, de, fr, es, it, ru, lat)

  - Office integration

  - Time tracking

  - Email attachment to business objects


  ## Pricing


  GPLv3 open-source edition available free; SaaS and commercial editions
  available.


  ## Deployment


  Self-hosted on Windows or SaaS/cloud deployment.


  ## Integrations


  - Microsoft SQL Server

  - Various cloud storage platforms

  - Office document formats


  ## Repository


  Source code available under GPLv3 license from OnlyOffice project.
