markdown: >-
  ## Overview


  Pivotal CRM, now marketed as Aptean CRM, is a customer relationship management
  platform first released in 1996. It provides sales, marketing, and customer
  service functionality for mid-sized and enterprise organizations.


  ## Features


  - Sales force automation

  - Marketing automation

  - Customer service and support

  - Web and Windows interface

  - Multi-language support

  - Office integration

  - Email attachment to business objects

  - Global search

  - LDAP support


  ## Pricing


  Proprietary licensing model. Pricing available from Aptean sales.


  ## Deployment


  On-premise deployment on Windows.


  ## Integrations


  - Microsoft Office

  - Email systems

  - LDAP directory services


  ## Repository


  Proprietary software; no public repository.
