markdown: >-
  ## Overview


  Oracle Advertising and Customer Experience (CX) is an enterprise customer
  experience and CRM suite first released in 2011. It provides integrated
  marketing, sales, commerce, and service capabilities for large organizations.


  ## Features


  - Marketing automation and campaign management

  - Sales force automation

  - Customer service and contact center

  - Commerce and order management

  - Customer data management

  - Advertising and audience targeting

  - Analytics and reporting

  - Multi-language support (26 languages)

  - Web-based interface

  - Office integration

  - Email attachment to business objects

  - Global search

  - LDAP support


  ## Pricing


  Proprietary or SaaS licensing model. Enterprise pricing available from Oracle
  sales.


  ## Deployment


  Cloud-based (SaaS) deployment.


  ## Integrations


  - Oracle Database

  - Oracle Cloud Infrastructure

  - Various enterprise systems via API


  ## Repository


  Proprietary software; no public repository.
