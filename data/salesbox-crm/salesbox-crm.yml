markdown: >-
  ## Overview


  Salesbox CRM is a customer relationship management platform first released in
  2014. It provides sales pipeline management, contact management, and
  collaboration features for sales teams.


  ## Features


  - Contact and account management

  - Sales pipeline and deal tracking

  - Team collaboration

  - Web-based interface

  - Mobile apps for iOS and Android

  - Multi-language support (de, en, es, fr, nl, pt, se, no, fi, tr, ro, ru, jp,
  ch, ko, hu)

  - Office integration

  - Email attachment to business objects

  - Global search

  - Time tracking


  ## Pricing


  SaaS subscription model with tiered pricing based on features and users.


  ## Deployment


  Cloud-based (SaaS) deployment.


  ## Integrations


  - Office integration

  - Email clients

  - Various third-party integrations


  ## Repository


  Proprietary software; no public repository.
